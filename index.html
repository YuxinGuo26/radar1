<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECharts 雷达图生成器</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- 相对路径引入外部样式和脚本 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>ECharts 雷达图生成器</h1>
        <div class="controls">
            <label for="data-input">输入 5 个维度数值（0-5，逗号分隔）：</label>
            <input type="text" id="data-input" value="4,3,4,4,3" placeholder="例如：4,3,4,4,3">
            <button id="generate-btn">生成雷达图</button>
        </div>
        <div id="chart" class="chart-container"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
